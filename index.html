<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gestión de Riesgos FEN - Línea 2 y 4</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="dashboard-container">
        
        <!-- PANEL IZQUIERDO (1/5 del espacio) -->
        <aside class="side-panel">
            <header class="panel-header">
                <h2>Gestión de Riesgos FEN</h2>
                <p>Línea 2 y 4 del Metro de Lima</p>
                <div class="telemetry">
                    <span id="onlineUsers">🟢 1 en línea</span>
                    <span id="totalVisits">👁️ 1,250 visitas</span>
                </div>
            </header>

            <!-- SECCIÓN 1: FILTROS -->
            <section class="panel-section">
                <h3>Filtros de Búsqueda</h3>
                <div class="filter-group">
                    <label>Filtrar por ID:</label>
                    <input type="text" id="filterId" placeholder="Ej. E26" class="search-input">
                </div>
                <div class="filter-group">
                    <label>Filtrar por Distrito:</label>
                    <input type="text" id="filterDistrito" placeholder="Ej. Ate, Callao..." class="search-input">
                </div>
                <div class="filter-group">
                    <label>Ramal / Línea:</label>
                    <select id="filterLinea" class="search-input">
                        <option value="">-- Todos --</option>
                        <option value="2">Línea 2</option>
                        <option value="4">Línea 4</option>
                    </select>
                </div>
            </section>

            <div class="aesthetic-separator"></div>

            <!-- SECCIÓN 2: CAPAS (TABLERO ANDON) -->
            <section class="panel-section">
                <h3>Capas del Mapa</h3>
                <div class="toggle-group">
                    <label><input type="checkbox" id="chkDistritos" checked> Delimitación Distrital</label>
                    <label><input type="checkbox" id="chkTopografia"> Topografía (Ráster MDE)</label>
                    <label><input type="checkbox" id="chkInundacion"> Peligro Inundación</label>
                    <label><input type="checkbox" id="chkHuaycos"> Peligro Mov. Masas</label>
                </div>
            </section>

            <div class="aesthetic-separator"></div>

            <!-- SECCIÓN 3: TABLA DE NIVELES DE PELIGRO -->
            <section class="panel-section table-section">
                <h3>Matriz de Peligros</h3>
                <div class="table-container">
                    <table id="riskTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Inundación</th>
                                <th>Mov. Masas</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Datos inyectados por JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <footer class="panel-footer">
                <a href="https://github.com/VlaCasPa/Mapa-de-Peligros-FER-2026-L2L4" target="_blank" class="btn-readme">📄 Info del Repositorio (README)</a>
            </footer>
        </aside>

        <!-- PANEL DERECHO: MAPA (4/5 del espacio) -->
        <main class="map-container">
            <div id="map"></div>
            <!-- Leyenda Dinámica Inferior Derecha -->
            <div id="mapLegend" class="map-legend">
                <h4>Leyenda</h4>
                <div id="legendContent">Seleccione una capa de riesgo</div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PapaParse para leer el CSV oficial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Script principal -->
    <script src="app.js"></script>
</body>
</html>
